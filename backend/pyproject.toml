[project]
name = "finance-app-api"
version = "0.1.0"
description = "Self-hosted household finance app: API and background worker"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "procrastinate>=3.12.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "pyotp>=2.12.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR2004", # magic values are fine in tests and HTTP status checks
    "PLR0913", # FastAPI handlers take many injected parameters
    "PLR0917", # same reason, positional
    "PLR0911",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415"]
"app/cli.py" = ["PLC0415"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["procrastinate.*", "testcontainers.*", "factory.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
